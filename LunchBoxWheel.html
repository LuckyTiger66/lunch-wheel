<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>中午吃什麼</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Noto+Serif+TC:wght@900&display=swap">
<style>
:root{
  --bg:#B3231B;--ink:#3A1E12;--paper:#FFF6E4;--yolk:#F4B41A;--chili:#D8352A;
  --line:#E6D2AA;--muted:#8B6B4E;--hit:#FDE7A8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#6E130E;--ink:#FBE9C8;--paper:#2B1610;--line:#4A2A1F;--muted:#C7A27E;--hit:#5A3414}
}
:root[data-theme="dark"]{--bg:#6E130E;--ink:#FBE9C8;--paper:#2B1610;--line:#4A2A1F;--muted:#C7A27E;--hit:#5A3414}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;min-height:100vh;color:var(--ink);
  font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  background-color:var(--bg);
  background-image:linear-gradient(rgba(255,255,255,.07) 50%,transparent 50%),linear-gradient(90deg,rgba(255,255,255,.07) 50%,transparent 50%);
  background-size:56px 56px;
}
main{max-width:1000px;margin:0 auto;padding:22px 16px 48px;display:grid;gap:24px}
header{text-align:center}
h1{
  margin:0;font-family:'Noto Serif TC','Songti TC','PMingLiU',serif;font-weight:900;
  font-size:clamp(40px,9vw,64px);letter-spacing:.08em;color:var(--yolk);
  text-shadow:0 3px 0 rgba(58,30,18,.45);
}
header p{margin:6px 0 12px;color:#FFF6E4;opacity:.9;font-size:15px}
.share-btn{font:inherit;font-weight:700;font-size:14px;cursor:pointer;padding:8px 14px;border-radius:999px;border:2px solid #FFF6E4;background:transparent;color:#FFF6E4}
.share-btn:active{transform:translateY(1px)}
.share-btn:focus-visible{outline:3px solid var(--yolk);outline-offset:3px}
.stage{display:flex;flex-direction:column;align-items:center;gap:18px}
.wheel{position:relative;width:min(88vw,440px);aspect-ratio:1}
.wheel canvas{width:100%;height:100%;display:block;filter:drop-shadow(0 10px 0 rgba(58,30,18,.3))}
.pointer{
  position:absolute;left:50%;top:-6px;transform:translateX(-50%);z-index:2;
  width:0;height:0;border-left:17px solid transparent;border-right:17px solid transparent;
  border-top:34px solid var(--yolk);filter:drop-shadow(0 2px 0 #3A1E12) drop-shadow(0 0 1px #3A1E12);
}
.go{
  font:inherit;font-weight:700;font-size:22px;letter-spacing:.2em;cursor:pointer;
  padding:14px 44px;border-radius:999px;border:3px solid #3A1E12;
  background:var(--yolk);color:#3A1E12;box-shadow:0 6px 0 #3A1E12;
  transition:transform .08s,box-shadow .08s;
}
.go:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 #3A1E12}
.go:disabled{opacity:.7;cursor:default}
.go:focus-visible,.btn:focus-visible,.row input:focus-visible,.row button:focus-visible{outline:3px solid #2F7D4F;outline-offset:2px}
.result{
  min-height:92px;width:min(88vw,440px);text-align:center;background:var(--paper);color:var(--ink);
  border-radius:16px;padding:14px 16px;border:3px dashed var(--chili);
}
.result small{display:block;color:var(--muted);font-size:14px}
.result strong{display:block;margin-top:2px;font-family:'Noto Serif TC','Songti TC',serif;font-weight:900;font-size:clamp(28px,7vw,38px);color:var(--chili);overflow-wrap:anywhere}
.panel{background:var(--paper);color:var(--ink);border-radius:18px;padding:18px;border:3px solid #3A1E12;box-shadow:0 8px 0 rgba(58,30,18,.35)}
.panel h2{margin:0 0 12px;font-size:20px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h2 span{font-size:13px;font-weight:400;color:var(--muted)}
.add{display:flex;gap:8px;margin-bottom:12px}
.add input,.row input{
  flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:transparent;
  border:2px solid var(--line);border-radius:10px;padding:9px 11px;
}
.btn{font:inherit;font-weight:700;cursor:pointer;border:2px solid #3A1E12;border-radius:10px;padding:9px 14px;background:#2F7D4F;color:#FFF6E4}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);font-weight:400;margin-top:12px;width:100%}
.list{display:grid;gap:8px;max-height:380px;overflow-y:auto;padding:2px}
.row{display:flex;gap:8px;align-items:center;border-radius:12px;padding:3px}
.row.hit{background:var(--hit)}
.row button{flex:none;width:38px;height:38px;font-size:20px;line-height:1;cursor:pointer;border:2px solid var(--line);border-radius:10px;background:transparent;color:var(--chili)}
.row button:disabled{opacity:.35;cursor:default}
.hint{margin:10px 0 0;font-size:13px;color:var(--muted)}
@media (min-width:860px){
  main{grid-template-columns:minmax(0,1fr) 360px;align-items:start;padding-top:36px}
  header{grid-column:1/-1}
  .panel{position:sticky;top:20px}
}
</style>
</head>
<body>
<main>
  <header>
    <h1>中午吃什麼</h1>
    <p>選不出來就交給轉盤，肚子餓不用再煩惱</p>
    <button class="share-btn" id="shareBtn" type="button">↗ 分享「中午吃什麼」</button>
  </header>

  <section class="stage">
    <div class="wheel">
      <div class="pointer"></div>
      <canvas id="cv" aria-label="午餐轉盤"></canvas>
    </div>
    <button class="go" id="go">開轉</button>
    <div class="result" aria-live="polite">
      <small id="lbl">按下按鈕，轉出今天的午餐</small>
      <strong id="res"></strong>
    </div>
  </section>

  <section class="panel">
    <h2>午餐選項 <span id="cnt"></span></h2>
    <div class="add">
      <input id="newItem" maxlength="20" placeholder="新增餐廳或餐點" aria-label="新增選項">
      <button class="btn" id="addBtn">加入</button>
    </div>
    <div class="list" id="list"></div>
    <p class="hint">直接點名稱即可修改，至少保留 2 個、最多 24 個選項。</p>
    <button class="btn ghost" id="reset">恢復預設清單</button>
  </section>
</main>

<script>
const DEFAULTS=['幸福潤餅','潮一品','美村園燒臘','正宗排骨','八方雲集鍋貼','食牛堂','四海食堂','老奶奶古早味','龍品魚丸','元品燒臘'];
const KEY='lunch-wheel-items',MAX=24,MIN=2,TAU=Math.PI*2;
const FONT="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif";
const COLS=[['#D8352A','#FFF6E4'],['#F4B41A','#3A1E12'],['#2F7D4F','#FFF6E4'],['#EE7B1F','#3A1E12'],['#7A3F22','#FFF6E4'],['#FBE7B8','#3A1E12']];
const $=id=>document.getElementById(id);
const cv=$('cv'),go=$('go'),listEl=$('list'),resEl=$('res'),lblEl=$('lbl');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

function load(){
  try{const a=JSON.parse(localStorage.getItem(KEY));
    if(Array.isArray(a)&&a.length>=MIN&&a.every(x=>typeof x==='string'))return a.slice(0,MAX);}catch(e){}
  return DEFAULTS.slice();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}

let items=load(),rot=0,spinning=false,winner=-1;

function draw(){
  const s=cv.clientWidth;if(!s)return;
  const d=Math.min(window.devicePixelRatio||1,2);
  cv.width=cv.height=Math.round(s*d);
  const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);c.clearRect(0,0,s,s);
  const cx=s/2,r=s/2-10,n=items.length,seg=TAU/n;
  c.beginPath();c.arc(cx,cx,r+9,0,TAU);c.fillStyle='#3A1E12';c.fill();
  c.beginPath();c.arc(cx,cx,r+4,0,TAU);c.fillStyle='#FFF6E4';c.fill();
  items.forEach((t,i)=>{
    let k=i%COLS.length;if(i===n-1&&k===0&&n>1)k=2;
    c.beginPath();c.moveTo(cx,cx);c.arc(cx,cx,r,rot+i*seg,rot+(i+1)*seg);c.closePath();
    c.fillStyle=COLS[k][0];c.fill();c.strokeStyle='#FFF6E4';c.lineWidth=2;c.stroke();
    c.save();c.translate(cx,cx);c.rotate(rot+(i+.5)*seg);
    c.textAlign='right';c.textBaseline='middle';c.fillStyle=COLS[k][1];
    let fs=Math.min(r*.1,r*seg*.5);c.font='700 '+fs+'px '+FONT;
    while(c.measureText(t).width>r*.68&&fs>9){fs--;c.font='700 '+fs+'px '+FONT}
    c.fillText(t,r-14,0);c.restore();
  });
  c.beginPath();c.arc(cx,cx,r*.13,0,TAU);c.fillStyle='#FFF6E4';c.fill();
  c.lineWidth=4;c.strokeStyle='#3A1E12';c.stroke();
  c.beginPath();c.arc(cx,cx,r*.05,0,TAU);c.fillStyle='#F4B41A';c.fill();
}

function renderList(){
  listEl.textContent='';
  items.forEach((t,i)=>{
    const row=document.createElement('div');row.className='row'+(i===winner?' hit':'');
    const inp=document.createElement('input');inp.value=t;inp.maxLength=20;inp.setAttribute('aria-label','選項 '+(i+1));
    inp.addEventListener('input',()=>{items[i]=inp.value;changed(false)});
    inp.addEventListener('blur',()=>{
      const v=inp.value.trim();
      if(!v&&items.length>MIN){items.splice(i,1);changed(true)}
      else{items[i]=v||DEFAULTS[0];inp.value=items[i];changed(false)}
    });
    const del=document.createElement('button');del.textContent='×';del.title='刪除';del.setAttribute('aria-label','刪除 '+t);
    del.disabled=items.length<=MIN;
    del.addEventListener('click',()=>{items.splice(i,1);changed(true)});
    row.append(inp,del);listEl.append(row);
  });
  $('cnt').textContent=items.length+' 個';
  go.disabled=spinning||items.length<MIN;
}
function changed(rerender){
  winner=-1;resEl.textContent='';lblEl.textContent='按下按鈕，轉出今天的午餐';
  save();draw();
  if(rerender)renderList();
  else{$('cnt').textContent=items.length+' 個';listEl.querySelectorAll('.hit').forEach(e=>e.classList.remove('hit'))}
}

function spin(){
  if(spinning||items.length<MIN)return;
  spinning=true;winner=-1;go.disabled=true;go.textContent='轉轉轉…';
  resEl.textContent='';lblEl.textContent='今天吃哪一家呢？';
  listEl.querySelectorAll('.hit').forEach(e=>e.classList.remove('hit'));
  const n=items.length,seg=TAU/n,idx=Math.floor(Math.random()*n);
  const target=-Math.PI/2-(idx+.5+(Math.random()-.5)*.7)*seg;
  const delta=(((target-rot)%TAU)+TAU)%TAU+TAU*(5+Math.floor(Math.random()*3));
  const start=rot,dur=reduce?1200:4800,t0=performance.now();
  (function f(t){
    const p=Math.min((t-t0)/dur,1);
    rot=start+delta*(1-Math.pow(1-p,4));draw();
    if(p<1)return requestAnimationFrame(f);
    spinning=false;winner=idx;go.textContent='再轉一次';
    lblEl.textContent='今天中午就吃';resEl.textContent=items[idx];
    renderList();
    const hit=listEl.querySelector('.hit');if(hit)hit.scrollIntoView({block:'nearest'});
  })(t0);
}

function add(){
  const inp=$('newItem'),v=inp.value.trim();
  if(!v)return inp.focus();
  if(items.length>=MAX){lblEl.textContent='最多 '+MAX+' 個選項，請先刪除一些';return}
  items.push(v);inp.value='';changed(true);inp.focus();
}

go.addEventListener('click',spin);
$('shareBtn').addEventListener('click',async()=>{
  const btn=$('shareBtn');
  const isHosted=/^https?:$/.test(location.protocol);
  try{
    if(isHosted && navigator.share){
      await navigator.share({title:'中午吃什麼',text:'幫你決定今天午餐的轉盤！',url:location.href});
    }else if(isHosted && navigator.clipboard){
      await navigator.clipboard.writeText(location.href);
      btn.textContent='✓ 網頁連結已複製';
      setTimeout(()=>btn.textContent='↗ 分享「中午吃什麼」',2200);
    }else{
      const file=new File([document.documentElement.outerHTML], '中午吃什麼.html', {type:'text/html'});
      if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({title:'中午吃什麼',text:'下載並開啟這個午餐轉盤網頁。',files:[file]});
      }else{
        alert('這份網頁檔尚未發布到網路。你可以先分享「中午吃什麼.html」檔案；若要讓朋友點網址直接開啟，需先將檔案上傳到網站空間。');
      }
    }
  }catch(err){
    if(err.name!=='AbortError') alert('目前無法直接分享，請使用瀏覽器的分享功能分享此 HTML 檔案。');
  }
});
$('addBtn').addEventListener('click',add);
$('newItem').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing)add()});
$('reset').addEventListener('click',()=>{items=DEFAULTS.slice();changed(true)});
addEventListener('resize',draw);
renderList();draw();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);
</script>
</body>
</html>
